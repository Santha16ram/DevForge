<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevForge</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="shell">
    <aside class="rail">
      <p class="mark">DevForge</p>
      <p class="mark-sub">Java lab · project board</p>
      <nav>
        <button type="button" data-view="home" class="nav-btn is-on">Home</button>
        <button type="button" data-view="projects" class="nav-btn">Projects</button>
      </nav>
      <p class="rail-note">Projects, tasks, and snippets. JDBC to MySQL (or H2 locally). No login.</p>
    </aside>

    <main>
      <header class="top">
        <div>
          <h1 id="page-title">Home</h1>
          <p id="page-sub">Counts, recent activity, and the two sample projects.</p>
        </div>
        <p class="stamp" id="clock"></p>
      </header>

      <section id="view-home" class="view"></section>
      <section id="view-projects" class="view hidden"></section>
      <section id="view-detail" class="view hidden"></section>
    </main>
  </div>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <form id="modal-form" class="sheet">
      <h2 id="modal-title">New item</h2>
      <div id="modal-fields"></div>
      <p id="modal-error" class="err"></p>
      <div class="row-end">
        <button type="button" id="modal-cancel" class="ghost">Cancel</button>
        <button type="submit" class="solid">Save</button>
      </div>
    </form>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
